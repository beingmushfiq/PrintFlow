services:
  mysql:
    image: mysql:8.0
    container_name: printflow-mysql
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootsecret}"
      MYSQL_DATABASE: "${DB_DATABASE:-printflow}"
      MYSQL_USER: "${DB_USERNAME:-printflow}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - printflow-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: printflow-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redispassword}"
    volumes:
      - redis_data:/data
    networks:
      - printflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: printflow-minio
    restart: unless-stopped
    ports:
      - "${FORWARD_MINIO_PORT:-9000}:9000"
      - "${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID:-printflow_admin}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY:-printflow_secret}"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - printflow-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2024-03-07T00-31-49Z
    container_name: printflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-printflow_admin} ${AWS_SECRET_ACCESS_KEY:-printflow_secret};
      /usr/bin/mc mb --ignore-existing local/${AWS_BUCKET:-printflow-storage};
      /usr/bin/mc anonymous set none local/${AWS_BUCKET:-printflow-storage};
      exit 0;
      "
    networks:
      - printflow-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: printflow-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_SMTP_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - printflow-network

  backend:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-printflow}"
      DB_USERNAME: "${DB_USERNAME:-printflow}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword}"
      REDIS_PORT: 6379
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-printflow_admin}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-printflow_secret}"
      AWS_BUCKET: "${AWS_BUCKET:-printflow-storage}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - printflow-network

  worker:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work redis --queue=payments,documents,printing,notifications,maintenance --sleep=3 --tries=3
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redispassword}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - printflow-network

  reverb:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${FORWARD_REVERB_PORT:-8080}:8080"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - printflow-network

  frontend:
    image: node:20-alpine
    container_name: printflow-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FORWARD_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://localhost/api/v1
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
    networks:
      - printflow-network

  nginx:
    image: nginx:alpine
    container_name: printflow-nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-80}:80"
      - "${FORWARD_HTTPS_PORT:-443}:443"
    volumes:
      - ./backend:/var/www/html
      - ./deployment/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
      - reverb
    networks:
      - printflow-network

networks:
  printflow-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
