services:
  mysql:
    image: mysql:8.0
    container_name: printflow-mysql-prod
    restart: always
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-printflow}"
      MYSQL_USER: "${DB_USERNAME:-printflow}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - printflow-prod-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: printflow-redis-prod
    restart: always
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}" --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - printflow-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: printflow-minio-prod
    restart: always
    ports:
      - "127.0.0.1:${FORWARD_MINIO_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: "${AWS_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${AWS_SECRET_ACCESS_KEY}"
    command: server /data
    volumes:
      - minio_prod_data:/data
    networks:
      - printflow-prod-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-backend-prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      APP_URL: "${APP_URL:-https://printflow.local}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-printflow}"
      DB_USERNAME: "${DB_USERNAME:-printflow}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: 6379
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_BUCKET: "${AWS_BUCKET:-printflow-storage}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - printflow-prod-network

  worker:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-worker-prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    command: php artisan queue:work redis --queue=payments,documents,printing,notifications,maintenance --sleep=3 --tries=3 --max-time=3600
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-printflow}"
      DB_USERNAME: "${DB_USERNAME:-printflow}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - printflow-prod-network

  reverb:
    build:
      context: ./deployment/docker/php
      dockerfile: Dockerfile
    container_name: printflow-reverb-prod
    restart: always
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_EDITION: "${APP_EDITION:-standalone}"
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - printflow-prod-network

  nginx:
    image: nginx:alpine
    container_name: printflow-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/var/www/frontend
      - ./deployment/nginx/printflow.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - reverb
    networks:
      - printflow-prod-network

networks:
  printflow-prod-network:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local
