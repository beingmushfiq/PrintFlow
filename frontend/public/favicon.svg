<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pf-grad-primary" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#245BDB"/>
      <stop offset="100%" stop-color="#14368B"/>
    </linearGradient>
    <linearGradient id="pf-grad-cyan" x1="22" y1="38" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="pf-shadow" x="12" y="24" width="40" height="28" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0A0E13" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="15" fill="url(#pf-grad-primary)"/>

  <!-- Back Sheet (Paper Feed) -->
  <path d="M22 13C22 11.8954 22.8954 11 24 11H40C41.1046 11 42 11.8954 42 13V22H22V13Z" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- Printer Feed Chamber / High-Precision Slot -->
  <rect x="13" y="21" width="38" height="15" rx="4.5" fill="#0C1427"/>
  <!-- Status LED: Ready / Online -->
  <circle cx="18.5" cy="28.5" r="2" fill="#10B981"/>
  <!-- Slot Laser Beam Line -->
  <rect x="24" y="27.5" width="21" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Flowing Front Output Paper Sheet -->
  <g filter="url(#pf-shadow)">
    <path d="M17.5 29C17.5 28.4477 17.9477 28 18.5 28H45.5C46.0523 28 46.5 28.4477 46.5 29V44.5C46.5 46.433 44.933 48 43 48H21C19.067 48 17.5 46.433 17.5 44.5V29Z" fill="#FFFFFF"/>
  </g>

  <!-- Dynamic Content Stream Lines -->
  <rect x="22" y="33.5" width="20" height="3" rx="1.5" fill="#245BDB"/>
  <rect x="22" y="38.5" width="13" height="3" rx="1.5" fill="url(#pf-grad-cyan)"/>
  <circle cx="39" cy="40" r="1.5" fill="#10B981"/>
</svg>
